name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l tool)"
      - run: go test -short ./...
      - run: shasum -a 256 -c acceptance/*.sha256 acceptance/legacy/baseline.sha256
