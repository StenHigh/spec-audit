# CONFIG синтетического Laravel-примера. bootstrap и composer.lock входят в snapshot по контракту.
version: 1
project_root: .
specs:
  paths: [spec.md]
code:
  paths: [app, bootstrap, config, database, composer.lock]
  include: ['*.php', 'composer.lock']
tests:
  paths: [tests]
  include: ['*.php']
reports_dir: ../../../.local/php-sdk/laravel-reports
runtime: {kind: docker-php, service: app}
sdk: {profile: laravel, timeout_seconds: 300}
scopes: []
